# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: quarto-dev/quarto-actions/setup@v2
      
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: |
            https://stan-dev.r-universe.dev
            https://topipa.r-universe.dev
      
      - name: Install pkgdown dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 4
          packages: |
            deps::.
            any::sessioninfo
            any::pkgdown
          needs: website
          dependencies: '"all"'
          extra-packages: |
            stan-dev/cmdstanr
            topipa/iwmm
            stan-dev/pkgdown-config
            any::textshaping

      - name: Install package for article build
        shell: Rscript {0}
        run: |
          pak::pkg_install(
            "local::.",
            dependencies = FALSE,
            upgrade = FALSE
          )
      
          stopifnot(requireNamespace("priorsense", quietly = TRUE))
      
          message(
            "Installed priorsense version: ",
            as.character(packageVersion("priorsense"))
          )
      
      - name: Build pkgdown articles with diagnostics
        shell: Rscript {0}
        env:
          QUARTO_LOG_LEVEL: DEBUG
          QUARTO_PRINT_STACK: "true"
        run: |
          options(
            warn = 1,
            error = function() {
              cat("\n=== R traceback ===\n")
              traceback(20)
      
              cat("\n=== rlang traceback ===\n")
              try(print(rlang::last_trace(drop = FALSE)))
      
              quit(status = 1, save = "no")
            }
          )
      
          pkgdown::build_articles(
            pkg = ".",
            quiet = FALSE,
            lazy = FALSE
          )
      
      - name: Build pkgdown site
        run: |
          pkgdown::build_site_github_pages(
            install = TRUE,
            new_process = FALSE
          )
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
